name: Build IMZYY XL Launcher (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - 'scripts/**'
      - 'android/**'
      - 'android-overlay/**'
      - '.github/workflows/android-debug.yml'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'

permissions:
  contents: write   # needed only to publish a GitHub Release on v* tags

jobs:
  build-imzyy:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      IMZYY_GITHUB_REPO: ${{ github.repository }}
    steps:
      - name: Checkout IMZYY project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('scripts/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'

      - name: Test IMZYY patcher
        run: python3 scripts/test-integration.py

      - name: Fetch open-source runtime and build IMZYY XL
        run: bash scripts/build-imzyy.sh all

      - name: APK size report
        run: |
          ls -lh output/*.apk
          echo "### APK size: $(du -h output/IMZYY-XL-Launcher-arm64-debug.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK, provenance and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: IMZYY-XL-Launcher-ARM64-debug
          path: |
            output/IMZYY-XL-Launcher-arm64-debug.apk
            output/BUILD-INFO.txt
            output/IMZYY-XL-Launcher-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/IMZYY-XL-Launcher-arm64-debug.apk
            output/BUILD-INFO.txt
            output/IMZYY-XL-Launcher-corresponding-source.tar.gz
          generate_release_notes: true

name: Build IMZYY XL with embedded Amethyst Engine

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'scripts/**'
      - 'third_party/**'
      - '.github/workflows/android-debug.yml'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

jobs:
  build-amethyst:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AMETHYST_REF: v3_openjdk
      IMZYY_ABI_FILTER: arm64-v8a
    steps:
      - name: Checkout IMZYY project
        uses: actions/checkout@v4

      - name: Verify project layout
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in scripts/build-amethyst.sh scripts/prepare-amethyst.py scripts/install-android-sdk-components.sh scripts/test-integration.py android/app/src/main/java/com/imzyy/xllauncher/MainActivity.kt android/app/src/main/java/com/imzyy/xllauncher/ui/UiKit.kt; do
            if [ ! -f "$f" ]; then echo "::error::File hilang di repo: $f. Upload ISI zip ke root repo (termasuk folder scripts/ dan android/), bukan folder luarnya."; missing=1; fi
          done
          exit $missing

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v3 requests Google's discontinued legacy `tools` SDK package by default.
      # v4 uses current cmdline-tools and no longer requests that package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902' # command-line tools 22.0
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-unset}}"
          command -v sdkmanager
          sdkmanager --version

      - name: Set up upstream-compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          validate-wrappers: false

      - name: Install Android build components required by upstream Amethyst
        shell: bash
        run: bash scripts/install-android-sdk-components.sh

      - name: Fetch Amethyst source and native submodules
        run: bash scripts/build-amethyst.sh fetch

      - name: Download the official Amethyst JRE 8 bootstrap asset
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: .build/Amethyst-Android/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Test integration patcher
        run: python3 scripts/test-integration.py

      - name: Overlay IMZYY, build and validate the single APK
        run: bash scripts/build-amethyst.sh build

      - name: Upload integrated APK and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: imzyy-xl-amethyst-engine-arm64-debug
          path: |
            output/IMZYY-XL-Amethyst-Engine-debug.apk
            output/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14

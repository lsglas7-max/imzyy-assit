cd ~/imzyy-assit

git pull --rebase origin main
cat > .github/workflows/android.yml <<'EOF'
name: Android Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          GALAXY_AI_API_URL: ${{ vars.GALAXY_AI_API_URL }}
          GALAXY_AI_API_URL_2: ${{ vars.GALAXY_AI_API_URL_2 }}
          GALAXY_VISION_API_URL: ${{ vars.GALAXY_VISION_API_URL }}
        run: gradle assembleDebug -PgalaxyAiApiUrl="$GALAXY_AI_API_URL" -PgalaxyAiApiUrl2="$GALAXY_AI_API_URL_2" -PgalaxyVisionApiUrl="$GALAXY_VISION_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-autopilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
EOF
git add -A
git commit -m "CI: pakai Android SDK bawaan runner"
git push origin main

name: GalaxyAutopilot Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - galaxy-autopilot

permissions:
  contents: read

jobs:
  build:
    name: Build GalaxyAutopilot APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GalaxyAutopilot source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Project root:"
          pwd
          echo "Gradle:"
          gradle --version
          echo "Android SDK:"
          sdkmanager --list_installed

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug 2>&1 | tee build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-autopilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-autopilot-build-log
          path: build.log
          if-no-files-found: ignore
